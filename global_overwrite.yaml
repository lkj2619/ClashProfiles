  - RULE-SET,Jetbrains_No_Resolve,DIRECT
  - RULE-SET,ChinaMax_Classical_No_IPv6_No_Resolve,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,漏网之鱼
