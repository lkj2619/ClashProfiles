mode: rule
log-level: info
ipv6: false
tcp-concurrent: true

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53
  route-exclude-address:
    - 192.168.3.0/24
    - 192.168.4.0/24
    - 192.168.8.0/24
    - 10.100.1.0/24
    - 10.100.2.0/24

dns:
  enable: true
  ipv6: false
  listen: 127.0.0.1:1053
  prefer-h3: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  use-hosts: true
  use-system-hosts: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://cloudflare-dns.com/dns-query#节点选择
    - https://dns.google/dns-query#节点选择
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "geosite:cn":
      - https://dns.alidns.com/dns-query
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "geosite:private"
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "+.pool.ntp.org"

hosts:
  6047f413-ad53.114837322.xyz: 9f6072cc-59fb-11f.88223163.xyz
  bepbjbgp01.114837322.xyz: fe5c432e-59f5-11f1.88223163.xyz
  bepgzbgp01.114837322.xyz: fe5c432e-59f5-11f2.88223163.xyz
  bepshbgp01.114837322.xyz: fe5c432e-59f5-11f3.88223163.xyz

proxy-groups:
  - name: "节点选择"
    type: select
    proxies:
      - "自动选择"
      - "香港"
      - "台湾"
      - "日本"
      - "新加坡"
      - "美国"
      - "全部节点"
      - DIRECT

  - name: "自动选择"
    type: url-test
    include-all: true
    exclude-type: direct
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "香港"
    type: select
    include-all: true
    exclude-type: direct
    filter: "香港 | HK|HK |Hong|🇭🇰"

  - name: "台湾"
    type: select
    include-all: true
    exclude-type: direct
    filter: "台湾 | TW|TW |Taiwan|Wan|🇨🇳|🇹🇼"

  - name: "日本"
    type: select
    include-all: true
    exclude-type: direct
    filter: "日本 | JP|JP |Japan|🇯🇵"

  - name: "新加坡"
    type: select
    include-all: true
    exclude-type: direct
    filter: "新加坡 | 狮城 | SG|SG |Singapore|🇸🇬"

  - name: "美国"
    type: select
    include-all: true
    exclude-type: direct
    filter: "美国 | US|US |United States|America|🇺🇸"

  - name: "全部节点"
    type: select
    include-all: true
    exclude-type: direct

  - name: "漏网之鱼"
    type: select
    proxies:
      - "节点选择"
      - DIRECT

  - name: "OpenAI"
    type: select
    proxies:
      - "美国"
      - "新加坡"
      - "日本"
      - "台湾"
      - "全部节点"

  - name: "Anthropic"
    type: select
    proxies:
      - "美国"
      - "新加坡"
      - "日本"
      - "台湾"
      - "全部节点"

