    behavior: classical
    format: yaml
    path: ./ruleset/Advertising_Classical_No_Resolve.yaml
    interval: 86400
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/Advertising/Advertising_Classical_No_Resolve.yaml"
