mode: rule
log-level: info
ipv6: false
tcp-concurrent: true

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
    - any:53
    - tcp://any:53
  route-exclude-address:
    - 192.168.3.0/24
    - 192.168.4.0/24
    - 192.168.8.0/24
    - 10.100.1.0/24
    - 10.100.2.0/24

dns:
  enable: true
  ipv6: false
  listen: 127.0.0.1:1053
  prefer-h3: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  use-hosts: true
  use-system-hosts: true
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://cloudflare-dns.com/dns-query#节点选择
    - https://dns.google/dns-query#节点选择
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver-policy:
    '+.163cdn-ai.net': 'udp://127.0.0.1:1053'
  nameserver-policy:
    '+.163cdn-ai.net': 'https://dns.alidns.com/dns-query#DIRECT'
    'geosite:cn':
      - https://dns.alidns.com/dns-query
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "geosite:private"
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "+.pool.ntp.org"
    - +.163cdn-ai.net

hosts:
  6047f413-ad53.163cdn-ai.net: 9c6072fc-59fb-11f.163cdn-ai.net
  bepbjbgp01.163cdn-ai.net: ef5c432e-59f5-11f1.163cdn-ai.net
  bepgzbgp01.163cdn-ai.net: ef5c432e-59f5-11f2.163cdn-ai.net
  bepshbgp01.163cdn-ai.net: ef5c432e-59f5-11f3.163cdn-ai.net

proxy-groups:
  - name: "节点选择"
    type: select
    proxies:
      - "自动选择"
      - "香港"
      - "台湾"
      - "日本"
      - "新加坡"
      - "美国"
      - "全部节点"
      - DIRECT

  - name: "自动选择"
    type: url-test
    include-all: true
    exclude-type: direct
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50

  - name: "香港"
    type: select
    include-all: true
    exclude-type: direct
    empty-fallback: REJECT
    filter: '(?i)香港|🇭🇰|(?:^|[^a-z0-9])(?:HKG?|Hong[ _-]*Kong)(?:[0-9]|[^a-z0-9]|$)'

  - name: "台湾"
    type: select
    include-all: true
    exclude-type: direct
    empty-fallback: REJECT
    filter: '(?i)[台臺][湾灣]|🇹🇼|(?:^|[^a-z0-9])(?:TWN?|Taiwan)(?:[0-9]|[^a-z0-9]|$)'

  - name: "日本"
    type: select
    include-all: true
    exclude-type: direct
    empty-fallback: REJECT
    filter: '(?i)日本|🇯🇵|(?:^|[^a-z0-9])(?:JPN?|Japan)(?:[0-9]|[^a-z0-9]|$)'

  - name: "新加坡"
    type: select
    include-all: true
    exclude-type: direct
    empty-fallback: REJECT
    filter: '(?i)新加坡|[狮獅]城|🇸🇬|(?:^|[^a-z0-9])(?:SGP?|Singapore)(?:[0-9]|[^a-z0-9]|$)'

  - name: "美国"
    type: select
    include-all: true
    exclude-type: direct
    empty-fallback: REJECT
    filter: '(?i)美[国國]|🇺🇸|(?:^|[^a-z0-9])(?:USA?|United[ _-]+States)(?:[0-9]|[^a-z0-9]|$)'

  - name: "全部节点"
    type: select
    include-all: true
    exclude-type: direct

  - name: "漏网之鱼"
    type: select
    proxies:
      - "节点选择"
      - DIRECT

  - name: "OpenAI"
    type: select
    proxies:
      - "美国"
      - "新加坡"
      - "日本"
      - "台湾"
      - "全部节点"

  - name: "Anthropic"
    type: select
    proxies:
      - "美国"
      - "新加坡"
      - "日本"
      - "台湾"
      - "全部节点"

